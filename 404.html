<script>
(function(){
  var KEY="tia-theme";
  var THEMES={aurora:"#0D1626",dark:"#0D1626",light:"#F3F6FB",bw:"#FFFFFF",fireweed:"#1A0B14",blush:"#FBF3F6",glacier:"#071820",sunset:"#1A0E0C"};
  var NAMES={aurora:"Aurora",light:"Light",bw:"Black & White",fireweed:"Fireweed",blush:"Blush",glacier:"Glacier",sunset:"Sunset"};
  function known(t){ if(!t) return null; if(t==="dark") return "aurora"; if(t==="pink") return "fireweed"; return THEMES[t] ? t : null; }
  function preferred(){
    try{ var s=known(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "bw" : "aurora";
  }
  function apply(theme){
    theme=known(theme)||"aurora";
    document.documentElement.setAttribute("data-theme", theme);
    var meta=document.getElementById("theme-color");
    if(meta) meta.setAttribute("content", THEMES[theme]);
    var btn=document.getElementById("theme-menu");
    if(btn) btn.setAttribute("aria-label", "Color theme, "+(NAMES[theme]||theme)+" selected. Open to change.");
    var list=document.getElementById("theme-options");
    if(list){
      var opts=list.querySelectorAll("[data-theme-value]");
      for(var i=0;i<opts.length;i++){
        var on=opts[i].getAttribute("data-theme-value")===theme;
        opts[i].setAttribute("aria-selected", on?"true":"false");
        opts[i].tabIndex=on?0:-1;
      }
    }
  }
  function save(theme){ try{ localStorage.setItem(KEY, theme); }catch(e){} apply(theme); }
  apply(preferred());
  function closeMenu(){
    var list=document.getElementById("theme-options"), btn=document.getElementById("theme-menu");
    if(!list||!btn) return;
    list.hidden=true;
    btn.setAttribute("aria-expanded","false");
  }
  function openMenu(){
    var list=document.getElementById("theme-options"), btn=document.getElementById("theme-menu");
    if(!list||!btn) return;
    list.hidden=false;
    btn.setAttribute("aria-expanded","true");
    var sel=list.querySelector('[aria-selected="true"]')||list.querySelector("[data-theme-value]");
    if(sel) sel.focus();
  }
  function wire(){
    apply(preferred());
    var root=document.getElementById("theme-picker"), btn=document.getElementById("theme-menu"), list=document.getElementById("theme-options");
    if(!root||!btn||!list) return;
    btn.addEventListener("click", function(ev){ ev.stopPropagation(); if(list.hidden) openMenu(); else closeMenu(); });
    list.addEventListener("click", function(ev){
      var t=ev.target.closest("[data-theme-value]");
      if(!t) return;
      ev.preventDefault();
      save(t.getAttribute("data-theme-value"));
      closeMenu();
      btn.focus();
    });
    document.addEventListener("click", function(ev){ if(!root.contains(ev.target)) closeMenu(); });
    document.addEventListener("keydown", function(ev){
      if(list.hidden) return;
      var opts=[].slice.call(list.querySelectorAll("[data-theme-value]"));
      var i=opts.indexOf(document.activeElement);
      if(ev.key==="Escape"){ ev.preventDefault(); closeMenu(); btn.focus(); return; }
      if(ev.key==="ArrowRight"||ev.key==="ArrowDown"){ ev.preventDefault(); opts[(i+1+opts.length)%opts.length].focus(); }
      if(ev.key==="ArrowLeft"||ev.key==="ArrowUp"){ ev.preventDefault(); opts[(i-1+opts.length)%opts.length].focus(); }
      if(ev.key==="Home"){ ev.preventDefault(); opts[0].focus(); }
      if(ev.key==="End"){ ev.preventDefault(); opts[opts.length-1].focus(); }
    });
  }
  document.addEventListener("DOMContentLoaded", wire);
})();
</script>
